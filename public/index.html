 --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--other:#898781;
 --axis:#3a4659;--target:#c3c2b7;--warn:#fab219;--serious:#ec835a;--good-ink:#0ca30c;--bad-ink:#f87171}
:root[data-theme=light]{--bg:#f3f5fa;--cd:#ffffff;--bd:#d5dce9;--tx:#1b2433;--mu:#63718a;--ac:#2f6fed;--in:#ffffff;--hl:#e6ecf7;--ct:#3a475c;color-scheme:light;

 --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;
 --axis:#c3c2b7;--target:#52514e;--good-ink:#006300;--bad-ink:#b42323}
.b.gh{color:var(--tx)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 'Noto Sans Thai',system-ui,sans-serif}
