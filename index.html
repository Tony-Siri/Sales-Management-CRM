<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SalesForce</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0E14;--cd:#141a24;--bd:#232c3b;--tx:#e6eaf2;--mu:#8b97ab;--ac:#4f8cff;--in:#0e131c;--hl:#1f2a3d;--ct:#c4cddb;color-scheme:dark}
:root[data-theme=light]{--bg:#f3f5fa;--cd:#ffffff;--bd:#d5dce9;--tx:#1b2433;--mu:#63718a;--ac:#2f6fed;--in:#ffffff;--hl:#e6ecf7;--ct:#3a475c;color-scheme:light}
.b.gh{color:var(--tx)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 'Noto Sans Thai',system-ui,sans-serif}
a{color:var(--ac);cursor:pointer}.mu{color:var(--mu)}small{font-size:12px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:10px 20px;border-bottom:1px solid var(--bd);background:var(--cd);position:sticky;top:0;z-index:5}
nav{display:flex;gap:4px;flex:1}nav a{padding:6px 12px;border-radius:8px;color:var(--mu)}nav a.on{background:var(--hl);color:var(--tx)}
main{padding:20px;max-width:1200px;margin:auto;overflow-x:auto}
input,select,textarea{background:var(--in);border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:8px 10px;font:inherit;width:100%}
.b{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.b.gh{background:var(--hl)}.b.rd{background:#c0392b;margin-right:auto}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:24px}
.k{background:var(--cd);border-radius:10px;padding:14px;display:flex;flex-direction:column}.k b{font-size:22px}
.r{display:grid;grid-template-columns:120px 1fr 190px;gap:12px;align-items:center;margin:8px 0}
.bar{height:10px;background:var(--hl);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#22c55e}
.kb{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px}
.col{background:var(--cd);border-radius:10px;padding:12px;min-height:300px}.col h4{margin:0}
.cd{background:var(--in);border:1px solid var(--bd);border-radius:8px;padding:10px;margin-top:10px;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:12px}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--bd)}
tr[data-a]{cursor:pointer}tr[data-a]:hover{background:var(--cd)}
.tg{padding:2px 9px;border-radius:9px;font-size:12px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.lg{max-width:340px;margin:12vh auto;padding:24px;display:flex;flex-direction:column;gap:10px;background:var(--cd);border-radius:14px}
.lg h1{margin:0}.er{color:#f87171;min-height:18px}
dialog{background:var(--cd);color:var(--tx);border:1px solid var(--bd);border-radius:14px;width:min(560px,94vw)}
dialog::backdrop{background:#000a}.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f2 label{display:flex;flex-direction:column;gap:3px;color:var(--mu)}
.ft{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.cg{display:grid;grid-template-columns:1fr 2fr;gap:12px;margin-bottom:24px}
.dn{width:150px;height:150px;border-radius:50%;margin:14px auto;display:grid;place-items:center}
.dn span{background:var(--cd);width:92px;height:92px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px}
.lgd i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.r2{display:grid;grid-template-columns:130px 1fr 110px;gap:10px;align-items:center;margin:12px 0}
.sb{height:16px;background:var(--hl);border-radius:8px;overflow:hidden}.sb>div{display:flex;height:100%}.sb i{display:block;height:100%}
section.tm{margin-bottom:36px;padding-bottom:8px;border-bottom:1px solid var(--bd)}section.tm h2{margin:26px 0 14px}.wt td{vertical-align:top}.wt .dh td{background:var(--hl)}.cm{margin-top:6px;padding:4px 8px;border-left:3px solid var(--ac);background:var(--in);font-size:12px;color:var(--ct);border-radius:4px}textarea{resize:vertical}.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:2px solid var(--tx);margin-top:6px}
.ch2{text-align:center;padding:6px 2px;font-weight:600;border-bottom:1px solid var(--bd)}
.cc{min-height:112px;border:1px solid var(--bd);padding:5px;font-size:13px;text-align:center;cursor:pointer;overflow-wrap:anywhere}
.cc.e{cursor:default;border-color:transparent}.cc:not(.e):hover{background:var(--hl)}
.cc .dn2{display:block;text-align:right;font-size:12px;color:var(--mu);margin-bottom:4px}
.cc.td{outline:2px solid #22c55e;outline-offset:-2px}
.who{background:#fde7d6;color:#1b2433;padding:6px 14px;border-radius:6px;font-weight:700}
@media(max-width:600px){.cc{min-height:70px;font-size:11px;padding:3px}}
@media(max-width:600px){.f2,.cg,.r2{grid-template-columns:1fr}.r{grid-template-columns:1fr}}
</style></head><body><div id="app"></div><dialog id="dlg"></dialog>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{getFirestore,collection,doc,setDoc,addDoc,updateDoc,deleteDoc,onSnapshot,writeBatch,arrayUnion,getDoc,query,where}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
// ===== ใส่ Firebase config ของโปรเจกต์คุณเองตรงนี้ (Firebase Console > Project settings > Your apps > Config) =====
const cfg={
 apiKey:"YOUR_API_KEY",
 authDomain:"YOUR_PROJECT_ID.firebaseapp.com",
 projectId:"YOUR_PROJECT_ID",
 storageBucket:"YOUR_PROJECT_ID.firebasestorage.app",
 messagingSenderId:"YOUR_SENDER_ID",
 appId:"YOUR_APP_ID"
};
// ======================================================================================================
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
const nowM=()=>{const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')};
let me=null,users=[],deals=[],tab='ov',M=nowM(),q='',rf='',tf='',wf='',W='',reports=[],rcom=[],unsubW=[],werr='',PM=nowM(),pf='',plans=[],unsubP=[],perr='',pinit=0,srs=[],unsubS=[],sinit=0,serr='',sq='',sst='',boot=false,unsub=[];
const C={won:['ปิดขายแล้ว','#22c55e'],c100:['Commit 100%','#4f8cff'],c80:['Commit 80%','#a78bfa'],pending:['รอลูกค้าพิจารณา','#f59e0b'],lost:['ปิดไม่ได้','#ef4444']};
const $=s=>document.querySelector(s);
let TH='dark';try{TH=localStorage.getItem('sf_theme')||'dark'}catch{}
const setTh=t=>{TH=t;document.documentElement.dataset.theme=t;try{localStorage.setItem('sf_theme',t)}catch{}};setTh(TH);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>(+n||0).toLocaleString('th-TH');
const val=d=>(+d.product||0)+(+d.install||0);
const inM=d=>d.cat==='won'||d.cat==='lost'?(d.closedMonth||d.month)===M:M>=d.month;
const sum=a=>a.reduce((s,d)=>s+val(d),0);
const dir=()=>me?.role==='director';
const can=d=>dir()||d.ownerId===me.id;
const mail=s=>{s=s.trim().toLowerCase();return s.includes('@')?s:s+'@salesforce.local'};
const nm=(id,f)=>users.find(u=>u.id===id)?.name||f||'';
const log=txt=>({t:Date.now(),by:me.name,txt});
const isSales=u=>u.role==='rep'||u.role==='am';
const viewAll=()=>['director','am','viewer'].includes(me?.role);
const writer=()=>['rep','am','spec'].includes(me?.role);
const RL={director:'Director',am:'Assistant Manager',rep:'Sales',spec:'Sales Spec',viewer:'ผู้เยี่ยมชม'};
const ymd=t=>t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
const monOf=s=>{const t=s?new Date(s+'T00:00:00'):new Date();t.setDate(t.getDate()-((t.getDay()+6)%7));return ymd(t)};
const addD=(s,n)=>{const t=new Date(s+'T00:00:00');t.setDate(t.getDate()+n);return ymd(t)};
const thD=s=>new Date(s+'T00:00:00').toLocaleDateString('th-TH',{day:'2-digit',month:'2-digit',year:'2-digit'});
const addM=(s,n)=>{const [y,m]=s.split('-').map(Number),t=new Date(y,m-1+n,1);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')};
const defPf=()=>{if(!viewAll()||me.role==='am')return me.id;const a=users.find(u=>u.role==='am');return(a||users.find(u=>['rep','spec'].includes(u.role))||{}).id||''};
const DN=['จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์','อาทิตย์'];

function loginView(msg='',first=false){$('#app').innerHTML=`<div class="lg"><h1>SalesForce</h1><span class="mu">ระบบ Commit ยอดขายทีม</span>${first?'<input id="nm" placeholder="ชื่อ Director">':''}<input id="em" placeholder="อีเมล หรือชื่อผู้ใช้"><input id="pw" type="password" placeholder="รหัสผ่าน (6 ตัวขึ้นไป)"><button class="b" data-a="${first?'setup':'login'}">${first?'สร้างบัญชี Director':'เข้าสู่ระบบ'}</button><div class="er">${esc(msg)}</div><a data-a="${first?'tologin':'tofirst'}">${first?'กลับไปเข้าสู่ระบบ':'ตั้งค่าครั้งแรก (Director)'}</a><a data-a="theme" class="mu">◐ สลับโหมดมืด/สว่าง</a></div>`}

onAuthStateChanged(auth,async u=>{unsub.forEach(f=>f());unsub=[];unsubW.forEach(f=>f());unsubW=[];unsubP.forEach(f=>f());unsubP=[];pinit=0;pf='';unsubS.forEach(f=>f());unsubS=[];sinit=0;srs=[];me=null;
 if(!u){loginView();return}
 if(boot)return;
 const s=await getDoc(doc(db,'users',u.uid));
 if(!s.exists()){await signOut(auth);loginView('บัญชีนี้ยังไม่ได้ลงทะเบียนในทีม ติดต่อ Director');return}
 start({id:u.uid,...s.data()})});
function start(u){me=u;W=monOf();tab=u.role==='spec'?'wk':'ov';
 unsub.push(onSnapshot(collection(db,'users'),s=>{users=s.docs.map(d=>({id:d.id,...d.data()}));me=users.find(x=>x.id===me.id)||me;if(!pinit){pinit=1;pf=defPf();subP()}render()}));
 unsub.push(onSnapshot(collection(db,'deals'),s=>{deals=s.docs.map(d=>({id:d.id,...d.data()}));render()}));subW()}

function render(){if(!me)return;if(tab==='sr'&&!sinit){sinit=1;subS()}const ds=deals.filter(inM);
 const NV=['viewer','spec'].includes(me.role),mg=dir()||me.role==='am';if(!mg&&tab==='tm')tab='ov';
 const T=[['ov','ภาพรวม'],['pl','Pipeline'],['al','Commit'],['wk','รายงานประจำสัปดาห์'],['pn','แพลนเข้าพบลูกค้า'],['sr','Sales Spec Report']];if(mg)T.push(['tm','ทีมและเป้า']);
 const body=tab==='ov'?ov(ds):tab==='pl'?pl(ds):tab==='al'?al(ds):tab==='wk'?wk():tab==='pn'?cal():tab==='sr'?sr():tm();
 $('#app').innerHTML=`<header><b>SalesForce</b><nav>${T.map(([k,l])=>`<a class="${tab===k?'on':''}" data-a="tab" data-k="${k}">${l}</a>`).join('')}</nav>${['wk','tm','pn','sr'].includes(tab)?'':`<input type="month" id="mo" value="${M}" style="width:150px">`}${NV?'':'<button class="b" data-a="new">+ ดีลใหม่</button>'}<span class="mu">${esc(me.name)} (${RL[me.role]||''})</span><a data-a="theme" title="สลับโหมดมืด/สว่าง">◐ มืด/สว่าง</a><a data-a="out">ออกจากระบบ</a></header><main>${body}</main>`}

const TEAMS=['PJ-BKK','PJ-PKT'];
const pct=(a,b)=>b?(a/b*100).toFixed(1)+'%':'-';
function sec(title,reps,ds){
 const cards=Object.entries(C).map(([k,[l,c]])=>{const x=ds.filter(d=>d.cat===k);return`<div class="k" style="border-top:3px solid ${c}"><span class="mu">${l}</span><b>฿${fmt(sum(x))}</b><small class="mu">${x.length} ดีล</small></div>`}).join('');
 const won=sum(ds.filter(d=>d.cat==='won')),qt=reps.reduce((s,u)=>s+(+u.quota||0),0);
 const bars=reps.map(u=>{const w=sum(ds.filter(d=>d.ownerId===u.id&&d.cat==='won')),p=u.quota?w/u.quota*100:0;return`<div class="r"><span>${esc(u.name)}</span><div class="bar"><i style="width:${Math.min(100,p)}%"></i></div><span class="mu">฿${fmt(w)} / ฿${fmt(u.quota)} (${pct(w,u.quota)})</span></div>`}).join('');
 return`<section class="tm"><h2>${esc(title)} <small class="mu">${reps.length} คน · มูลค่าดีลรวม ฿${fmt(sum(ds))}</small></h2><div class="g">${cards}</div>${ch(ds,reps)}<h3>ยอดปิดขายเทียบเป้า เดือน ${M}</h3><div class="r" style="font-weight:600"><span>รวมทีม</span><div class="bar"><i style="width:${Math.min(100,qt?won/qt*100:0)}%"></i></div><span>฿${fmt(won)} / ฿${fmt(qt)} (${pct(won,qt)})</span></div>${bars||'<p class="mu">ยังไม่มีเซลส์ในทีมนี้</p>'}</section>`}
function ov(ds){const R=users.filter(isSales),ids=new Set(R.map(u=>u.id));
 const parts=TEAMS.map(t=>{const r=R.filter(u=>u.team===t);return sec(t,r,ds.filter(d=>r.some(u=>u.id===d.ownerId)))});
 const o=R.filter(u=>!TEAMS.includes(u.team)),od=ds.filter(d=>o.some(u=>u.id===d.ownerId)||!ids.has(d.ownerId));
 if(o.length||od.length)parts.push(sec('ยังไม่ระบุทีม',o,od));
 return parts.join('')}
function ch(ds,reps){const tot=sum(ds);let a=0;
 const seg=Object.keys(C).map(k=>{const v=sum(ds.filter(d=>d.cat===k)),s=a;a+=tot?v/tot*100:0;return`${C[k][1]} ${s}% ${a}%`}).join(',');
 const lgd=Object.entries(C).map(([k,[l,c]])=>`<div><i style="background:${c}"></i>${l} <span class="mu">฿${fmt(sum(ds.filter(d=>d.cat===k)))}</span></div>`).join('');
 const mx=Math.max(1,...reps.map(u=>sum(ds.filter(d=>d.ownerId===u.id))));
 const rows=reps.map(u=>{const m=ds.filter(d=>d.ownerId===u.id),t=sum(m);return`<div class="r2"><span>${esc(u.name)}</span><div class="sb"><div style="width:${t/mx*100}%">${Object.entries(C).map(([k,[l,c]])=>{const v=sum(m.filter(d=>d.cat===k));return v?`<i title="${l} ฿${fmt(v)}" style="width:${v/t*100}%;background:${c}"></i>`:''}).join('')}</div></div><span class="mu">฿${fmt(t)}</span></div>`}).join('');
 return`<div class="cg"><div class="k"><b>สัดส่วนมูลค่าตามสถานะ</b><div class="dn" style="background:${tot?`conic-gradient(${seg})`:'var(--hl)'}"><span>฿${fmt(tot)}</span></div><div class="lgd">${lgd}</div></div><div class="k"><b>มูลค่าดีลของแต่ละคน แยกตามสถานะ</b>${rows||'<span class="mu">ยังไม่มีข้อมูล</span>'}</div></div>`}
const card=d=>`<div class="cd" draggable="${can(d)}" data-id="${d.id}" data-a="edit"><b>${esc(d.title)}</b><div class="mu">${esc(d.company)}</div><div>฿${fmt(val(d))}</div><small class="mu">${esc(nm(d.ownerId,d.ownerName))}</small></div>`;
function pl(ds){return`<div class="kb">${Object.entries(C).map(([k,[l,c]])=>{const x=ds.filter(d=>d.cat===k);return`<div class="col" data-k="${k}"><h4 style="color:${c}">${l} <small>(${x.length})</small></h4><small class="mu">฿${fmt(sum(x))}</small>${x.map(card).join('')}</div>`}).join('')}</div>`}

function al(ds){const x=ds.filter(d=>(!rf||d.ownerId===rf)&&(!tf||users.some(u=>u.id===d.ownerId&&u.team===tf))&&(d.title+d.company+nm(d.ownerId,d.ownerName)).toLowerCase().includes(q.toLowerCase()));
 return`<div style="display:flex;gap:10px;flex-wrap:wrap"><select id="tf" style="width:150px"><option value="">ทุกทีม</option>${TEAMS.map(t=>`<option ${tf===t?'selected':''}>${t}</option>`).join('')}</select><select id="rf" style="width:260px"><option value="">เซลส์ทั้งหมด</option>${users.filter(u=>!['viewer','spec'].includes(u.role)&&(!tf||u.team===tf)).map(u=>`<option value="${u.id}" ${rf===u.id?'selected':''}>${esc(u.name)}</option>`).join('')}</select><input id="q" placeholder="ค้นหาโครงการ ลูกค้า หรือเซลส์" value="${esc(q)}"></div><p class="mu">${x.length} ดีล รวม ฿${fmt(sum(x))}</p><table><tr><th>โครงการ<th>ลูกค้า<th>เซลส์<th>สถานะ<th>มูลค่า<th>หมายเหตุ<th></tr>${x.map(d=>`<tr data-a="edit" data-id="${d.id}"><td>${esc(d.title)}<td>${esc(d.company)}<td>${esc(nm(d.ownerId,d.ownerName))}<td><span class="tg" style="background:${C[d.cat][1]}22;color:${C[d.cat][1]}">${C[d.cat][0]}</span><td>฿${fmt(val(d))}<td>${esc(d.note)}<td>${can(d)?'':'🔒'}</tr>`).join('')}</table>`}

const tsel=u=>!['rep','am','spec'].includes(u.role)?'-':dir()?`<select data-t="${u.id}" style="width:120px"><option value="">ยังไม่ระบุ</option>${TEAMS.map(t=>`<option ${u.team===t?'selected':''}>${t}</option>`).join('')}</select>`:esc(u.team||'-');
function tm(){return`<table><tr><th>ชื่อ<th>อีเมล<th>ตำแหน่ง<th>ทีม<th>เป้าต่อเดือน<th></tr>${users.map(u=>`<tr><td>${esc(u.name)}<td>${esc((u.email||'').replace('@salesforce.local',''))}<td>${RL[u.role]||u.role}<td>${tsel(u)}<td>${dir()&&isSales(u)?`<a data-a="quota" data-id="${u.id}">฿${fmt(u.quota)} แก้ไข</a>`:(isSales(u)?'฿'+fmt(u.quota):'-')}<td>${dir()?`<a data-a="uedit" data-id="${u.id}">แก้ไข</a>`+(u.id!==me.id?` &nbsp; <a data-a="udel" data-id="${u.id}" style="color:#f87171">ลบ</a>`:''):''}</tr>`).join('')}</table>${dir()?`<h3>เพิ่มผู้ใช้</h3><div class="f"><select id="rr"><option value="rep">Sales</option><option value="am">Assistant Manager</option><option value="spec">Sales Spec (ไม่มีเป้า กรอกได้เฉพาะรายงาน)</option><option value="viewer">ผู้เยี่ยมชม (ดูอย่างเดียว)</option></select><select id="rt">${TEAMS.map(t=>`<option>${t}</option>`).join('')}</select><input id="rn" placeholder="ชื่อที่แสดง"><input id="re" placeholder="อีเมล หรือชื่อผู้ใช้ เช่น Management"><input id="rp" placeholder="รหัสผ่าน"><input id="rq" type="number" placeholder="เป้าต่อเดือน (เฉพาะเซลส์)"><button class="b" data-a="addrep">เพิ่มผู้ใช้</button></div><div class="er" id="rm"></div>`:''}`}

function open(d){const e=!!d;d=d||{cat:'c80',month:M};const ro=e&&!can(d);
 const ow=dir()?`<select id="fo">${users.filter(u=>!['viewer','spec'].includes(u.role)).map(u=>`<option value="${u.id}" ${(d.ownerId||me.id)===u.id?'selected':''}>${esc(u.name)}</option>`).join('')}</select>`:`<input disabled value="${esc(e?nm(d.ownerId,d.ownerName):me.name)}">`;

 else if(a==='setup')await setup();
 else if(a==='quota'){const v=prompt('เป้ายอดขายต่อเดือน (บาท)');if(v!==null)await updateDoc(doc(db,'users',id),{quota:+v||0})}
 else if(a==='addrep')await addRep();

 else if(a==='wsave')await wsave(id);
 else if(a==='wdel'){if(confirm('ลบรายการนี้?')){await deleteDoc(doc(db,'reports',id));$('#dlg').close()}}
 else if(a==='wcom')await wcom(id);
 else if(a==='uedit')udlg(id);
 else if(a==='pprev'){PM=addM(PM,-1);subP();render()}
 else if(a==='pnext'){PM=addM(PM,1);subP();render()}
 else if(a==='pedit')pdlg(b.dataset.dt);

 else if(a==='ssave')await ssave(id);
 else if(a==='sdel'){if(confirm('ลบรายการนี้?')){await deleteDoc(doc(db,'specrep',id));$('#dlg').close()}}
 else if(a==='usave')await usave(id);
 else if(a==='udel'){const u=users.find(x=>x.id===id);if(u&&u.id!==me.id&&u.role!=='director'&&confirm('ลบ '+u.name+' ออกจากรายชื่อ?\nดีลและรายงานเดิมยังอยู่ แต่บัญชีนี้จะเข้าสู่ระบบไม่ได้อีก'))await deleteDoc(doc(db,'users',id))}}
 catch(err){const m=$('.er');if(m)m.textContent=err.code||err.message}});
document.addEventListener('change',e=>{if(e.target.id==='mo'){M=e.target.value||M;render()}if(e.target.id==='rf'){rf=e.target.value;render()}if(e.target.id==='tf'){tf=e.target.value;rf='';render()}if(e.target.id==='wd'){W=monOf(e.target.value||W);subW();render()}if(e.target.id==='wf'){wf=e.target.value;render()}if(e.target.id==='pmo'){PM=e.target.value||PM;subP();render()}if(e.target.id==='pfs'){pf=e.target.value;subP();render()}if(e.target.id==='sst'){sst=e.target.value;render()}if(e.target.dataset.t)updateDoc(doc(db,'users',e.target.dataset.t),{team:e.target.value}).catch(x=>alert(x.code));});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;render();const f=$('#q');f.focus();f.setSelectionRange(99,99)}if(e.target.id==='sq'){sq=e.target.value;render();const f=$('#sq');f.focus();f.setSelectionRange(99,99)}});
document.addEventListener('dragstart',e=>{const c=e.target.closest('.cd');if(c)e.dataTransfer.setData('t',c.dataset.id)});
document.addEventListener('dragover',e=>{if(e.target.closest('.col'))e.preventDefault()});
document.addEventListener('drop',async e=>{const c=e.target.closest('.col');if(!c)return;e.preventDefault();
 const d=deals.find(x=>x.id===e.dataTransfer.getData('t')),k=c.dataset.k;
 if(d&&d.cat!==k&&can(d))await updateDoc(doc(db,'deals',d.id),{cat:k,closedMonth:k==='won'||k==='lost'?nowM():'',act:arrayUnion(log('เปลี่ยนสถานะเป็น '+C[k][0]))}).catch(x=>alert(x.code))});
