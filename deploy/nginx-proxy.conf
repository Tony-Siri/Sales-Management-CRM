# RunCloud custom NGINX config for the NARA CRM web application.
#
# Where: RunCloud > Web Application > <app> > NGiNX Config > Add a New Config
#        Type: "location.root"   Name: crm-proxy
# Requires the app stack "Native NGINX + Custom Config" and the web app's
# public path set to the repository's /public folder.
#
# PocketBase listens on 127.0.0.1:8090 (see deploy/pocketbase.service).

# ---- static page --------------------------------------------------------
location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "DENY";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()";
    # Scripts only from this origin (app.js + vendor SDK). Inline styles are used
    # by the UI, fonts come from Google Fonts. The OAuth popup is a navigation,
    # not covered by CSP.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
}

location /vendor/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
}

# ---- PocketBase API (REST, realtime SSE, files, OAuth2 redirect) -------
location /api/ {
    client_max_body_size 25M;            # 10 MB documents + 5 MB images, with headroom

    proxy_http_version 1.1;
    proxy_set_header Connection '';      # keep-alive; required for SSE realtime
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;                 # stream SSE events immediately
    proxy_cache off;
    proxy_read_timeout 360s;             # realtime connections stay open ~5 min
    proxy_send_timeout 360s;

    proxy_pass http://127.0.0.1:8090;
}

# ---- PocketBase admin dashboard ------------------------------------------
# Restrict to your office / VPN IP addresses. Replace the example and keep
# "deny all". Remove the allow/deny lines if you prefer to rely only on the
# superuser password (not recommended).
location /_/ {
    # allow 203.0.113.10;
    # deny all;

    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8090;
}

# Deny access to anything that is not the public page or the API.
location ~ ^/(pb_data|pb_hooks|pb_migrations|deploy|docs|\.env|\.git) {
    return 404;
}
